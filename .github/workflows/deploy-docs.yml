name: Deploy Ariane docs to manuals.arianesline.com

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      # Regenerate the always-current manual PDF from the freshly built site.
      # It is written into build/ after the build, so it ships with the rsync
      # below but never exists during `npm run build` — which is why the footer
      # links to it by absolute URL rather than as an internal route.
      - name: Generate latest-manual PDF
        run: |
          # docs-to-pdf drives puppeteer, which expects a Chromium in
          # ~/.cache/puppeteer. npm no longer runs install scripts by default, so
          # puppeteer's postinstall never downloads it and the launch fails with
          # "Browser was not found at the configured executablePath". Install it
          # explicitly, matching the puppeteer major that docs-to-pdf depends on.
          npx --yes puppeteer@24 browsers install chrome
          # puppeteer's page.pdf() does not create parent directories. static/pdf/
          # (the German translation) now puts build/pdf/ there anyway, but keep the
          # mkdir so the generated PDF does not depend on that file sticking around.
          mkdir -p build/pdf
          npx docusaurus serve --port 3123 --no-open &
          for i in $(seq 1 30); do curl -sf http://localhost:3123/ariane/ >/dev/null && break; sleep 1; done
          npx --yes docs-to-pdf@1.4.0 --initialDocURLs="http://localhost:3123/ariane/docs/Starter" --contentSelector="article" --paginationSelector="a.pagination-nav__link--next" --excludeSelectors=".theme-doc-breadcrumbs,.theme-edit-this-page,.pagination-nav,.theme-doc-toc-mobile" --coverTitle="Ariane — User Manual" --coverSub="Generated $(date -u +%F) — tracks the online manual" --puppeteerArgs="--no-sandbox,--disable-setuid-sandbox" --outputPDFFilename="build/pdf/Ariane-UserManual-latest.pdf"
          kill %1 2>/dev/null || true

      # Ships to the VPS through the write-only rrsync jail (docs dir only).
      - name: Deploy to VPS
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          # Strip CR: a key pasted into the secret from a Windows editor arrives
          # CRLF-terminated, which OpenSSH rejects with "error in libcrypto".
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail with something actionable rather than an opaque libcrypto error.
          # -y derives the public key, so this validates the private key without
          # printing any of it.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::DOCS_DEPLOY_KEY is not a valid OpenSSH private key. Set it from the key file so its newlines survive, e.g. 'gh secret set DOCS_DEPLOY_KEY --repo <repo> < deploy_key'. A PuTTY .ppk must be converted first."
            exit 1
          fi
          ssh-keyscan -t ed25519 51.161.35.92 >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" build/ aline@51.161.35.92:/ariane
